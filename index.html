<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kavu's Camera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="camera">

        <!-- LCD SCREEN -->
        <div class="screen">

            <div class="screen-top">
                <span>●</span>
                <span>AUTO</span>
                <span>🔋</span>
            </div>

            <div class="screen-center">
                <div class="focus-box"></div>
            </div>

            <div class="screen-bottom">
                <span>1/125</span>
                <span>F2.8</span>
                <span>ISO 200</span>
            </div>

        </div>


        <!-- CAMERA CONTROLS -->

        <div class="controls">

            <button class="small-button">MENU</button>

            <button class="small-button">DISP</button>

            <button class="small-button playback">
                ▶
            </button>

            <div class="control-wheel">

                <div class="wheel-center">
                    SET
                </div>

                <div class="wheel-top">▲</div>
                <div class="wheel-bottom">▼</div>
                <div class="wheel-left">◀</div>
                <div class="wheel-right">▶</div>

            </div>

            <button class="small-button video">
                ●
            </button>

        </div>

    </div>

</body>
</html>
