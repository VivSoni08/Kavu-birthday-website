<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kavu's Camera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="camera">

        <!-- =========================
             TOP CAMERA CONTROLS
        ========================== -->

        <div class="top-controls">

            <button class="power-button" aria-label="Power">
                ⏻
            </button>

            <div class="shutter-area">

                <button class="shutter-button" aria-label="Shutter">
                    <span></span>
                </button>

                <div class="zoom-rocker">
                    <span class="zoom-wide">W</span>
                    <span class="zoom-tele">T</span>
                </div>

            </div>

        </div>


        <!-- =========================
             LCD SCREEN
        ========================== -->

        <div class="screen">

            <!-- STARTUP SCREEN -->

            <div class="startup-screen">

                <div class="canon-logo">
                    CANON
                </div>

                <div class="powershot-logo">
                    PowerShot
                </div>

            </div>


            <!-- SHOOTING SCREEN -->

            <div class="shooting-screen">

                <!-- SCREEN TOP -->

                <div class="screen-top">

                    <span class="record-indicator">
                        ●
                    </span>

                    <span class="mode-indicator">
                        AUTO
                    </span>

                    <span class="battery-indicator">
                        🔋 <span id="battery-level">100%</span>
                    </span>

                </div>


                <!-- SCREEN CENTER -->

                <div class="screen-center">

                    <div class="live-view">

                        <img
                            id="memory-image"
                            src="images/test-1.png"
                            alt="Camera memory"
                        >

                    </div>

                    <!-- Focus box -->

                    <div class="focus-box"></div>


                    <!-- REC indicator -->

                    <div class="rec-display">

                        <span class="rec-dot">
                            ●
                        </span>

                        <span>REC</span>

                        <span id="record-time">
                            00:00
                        </span>

                    </div>


                    <!-- Playback indicator -->

                    <div class="playback-indicator">
                        ▶
                    </div>


                    <!-- Photo number -->

                    <div class="photo-counter">

                        <span id="current-photo">
                            1
                        </span>

                        /

                        <span id="total-photos">
                            3
                        </span>

                    </div>

                </div>


                <!-- SCREEN BOTTOM -->

                <div class="screen-bottom">

                    <span>
                        1/125
                    </span>

                    <span>
                        F2.8
                    </span>

                    <span>
                        ISO 200
                    </span>

                </div>

            </div>

        </div>


        <!-- =========================
             CAMERA CONTROLS
        ========================== -->

        <div class="controls">

            <button class="small-button menu-button">
                MENU
            </button>

            <button class="small-button disp-button">
                DISP
            </button>

            <button class="small-button playback">
                ▶
            </button>


            <div class="control-wheel">

                <div class="wheel-center">
                    SET
                </div>

                <div class="wheel-top">
                    ▲
                </div>

                <div class="wheel-bottom">
                    ▼
                </div>

                <div class="wheel-left">
                    ◀
                </div>

                <div class="wheel-right">
                    ▶
                </div>

            </div>


            <button class="small-button video">
                ●
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
