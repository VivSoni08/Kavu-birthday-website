<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kavu's Camera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="camera">

        <!-- =========================
             TOP CAMERA CONTROLS
        ========================== -->

        <div class="top-controls">

            <button class="power-button" aria-label="Power">
                ⏻
            </button>

            <div class="shutter-area">

                <button class="shutter-button" aria-label="Shutter">
                    <span></span>
                </button>

                <div class="zoom-rocker">
                    <span>W</span>
                    <span>T</span>
                </div>

            </div>

        </div>


        <!-- =========================
             LCD SCREEN
        ========================== -->

        <div class="screen">

            <!-- STARTUP SCREEN -->

            <div class="startup-screen">

                <div class="canon-logo">
                    CANON
                </div>

                <div class="powershot-logo">
                    PowerShot
                </div>

            </div>


            <!-- SHOOTING SCREEN -->

            <div class="shooting-screen">

                <div class="screen-top">
                    <span>●</span>
                    <span>AUTO</span>
                    <span>🔋 100%</span>
                </div>


                <div class="screen-center">

                    <div class="live-view">

                        <img
                            id="memory-image"
                            src="images/test-1.png"
                            alt="Camera memory"
                        >

                    </div>

                    <div class="focus-box"></div>

                </div>


                <div class="screen-bottom">

                    <span>1/125</span>
                    <span>F2.8</span>
                    <span>ISO 200</span>

                </div>

            </div>

        </div>


        <!-- =========================
             CAMERA CONTROLS
        ========================== -->

        <div class="controls">

            <button class="small-button">
                MENU
            </button>

            <button class="small-button">
                DISP
            </button>

            <button class="small-button playback">
                ▶
            </button>


            <div class="control-wheel">

                <div class="wheel-center">
                    SET
                </div>

                <div class="wheel-top">
                    ▲
                </div>

                <div class="wheel-bottom">
                    ▼
                </div>

                <div class="wheel-left">
                    ◀
                </div>

                <div class="wheel-right">
                    ▶
                </div>

            </div>


            <button class="small-button video">
                ●
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>
</html>
