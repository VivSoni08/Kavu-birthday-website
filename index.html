<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kavu's Camera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="camera">

        <!-- =====================================================
             CAMERA BODY DETAILS
        ====================================================== -->

        <div class="camera-highlight"></div>

        <div class="camera-grip"></div>

        <div class="af-assist">
            <div class="af-light"></div>
        </div>


        <!-- =====================================================
             TOP CAMERA CONTROLS
        ====================================================== -->

        <div class="top-controls">

            <div class="status-led"></div>

            <button class="power-button" aria-label="Power">
                ⏻
            </button>

            <div class="shutter-area">

                <button class="shutter-button" aria-label="Shutter">
                    <span></span>
                </button>

                <div class="zoom-rocker">

                    <span class="zoom-wide">
                        W
                    </span>

                    <span class="zoom-tele">
                        T
                    </span>

                </div>

            </div>

        </div>


        <!-- =====================================================
             LCD SCREEN
        ====================================================== -->

        <div class="screen">

            <!-- SCREEN GLASS -->
            <div class="screen-glass"></div>


            <!-- =================================================
                 STARTUP SCREEN
            ================================================== -->

            <div class="startup-screen">

                <div class="startup-glow"></div>

                <div class="canon-logo">
                    CANON
                </div>

                <div class="powershot-logo">
                    PowerShot
                </div>

                <div class="startup-line"></div>

            </div>


            <!-- =================================================
                 SHOOTING SCREEN
            ================================================== -->

            <div class="shooting-screen">

                <!-- TOP INFORMATION -->

                <div class="screen-top">

                    <span class="record-indicator">
                        ●
                    </span>

                    <span class="mode-indicator">
                        AUTO
                    </span>

                    <span class="battery-indicator">
                        🔋 <span id="battery-level">100%</span>
                    </span>

                </div>


                <!-- CENTER -->

                <div class="screen-center">

                    <!-- PHOTO -->

                    <div class="live-view">

                        <img
                            id="memory-image"
                            src="images/test-1.png"
                            alt="Camera memory"
                        >

                        <div class="photo-vignette"></div>

                    </div>


                    <!-- FOCUS RETICLE -->

                    <div class="focus-box">

                        <span class="focus-corner top-left"></span>
                        <span class="focus-corner top-right"></span>
                        <span class="focus-corner bottom-left"></span>
                        <span class="focus-corner bottom-right"></span>

                    </div>


                    <!-- FOCUS STATUS -->

                    <div class="focus-status">
                        AF
                    </div>


                    <!-- RECORDING DISPLAY -->

                    <div class="rec-display">

                        <span class="rec-dot">
                            ●
                        </span>

                        <span>
                            REC
                        </span>

                        <span id="record-time">
                            00:00
                        </span>

                    </div>


                    <!-- PLAYBACK -->

                    <div class="playback-indicator">
                        ▶
                    </div>


                    <!-- PHOTO COUNTER -->

                    <div class="photo-counter">

                        <span id="current-photo">
                            1
                        </span>

                        /

                        <span id="total-photos">
                            3
                        </span>

                    </div>


                    <!-- LCD GRID / COMPOSITION MARKERS -->

                    <div class="lcd-grid"></div>

                </div>


                <!-- BOTTOM INFORMATION -->

                <div class="screen-bottom">

                    <span>
                        1/125
                    </span>

                    <span>
                        F2.8
                    </span>

                    <span>
                        ISO 200
                    </span>

                </div>

            </div>

        </div>


        <!-- =====================================================
             CAMERA CONTROLS
        ====================================================== -->

        <div class="controls">

            <button class="small-button menu-button">
                MENU
            </button>

            <button class="small-button disp-button">
                DISP
            </button>

            <button class="small-button playback">
                ▶
            </button>


            <div class="control-wheel">

                <div class="wheel-center">
                    SET
                </div>

                <div class="wheel-top">
                    ▲
                </div>

                <div class="wheel-bottom">
                    ▼
                </div>

                <div class="wheel-left">
                    ◀
                </div>

                <div class="wheel-right">
                    ▶
                </div>

            </div>


            <button class="small-button video">
                ●
            </button>

        </div>


        <!-- =====================================================
             SMALL CAMERA LABEL
        ====================================================== -->

        <div class="camera-label">
            PowerShot
        </div>

        <div class="camera-model">
            DIGITAL CAMERA
        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script src="script.js"></script>

</body>

</html>
